        let filterStrand = 'All';
        let filterTime = 'All';
        let currentSort = 'random';
        let searchQuery = '';

        const grid = document.getElementById('course-grid');
        const sortSelect = document.getElementById('sort-select');
        const searchInput = document.getElementById('search-input');
        const overlay = document.getElementById('modal-overlay');

        function renderGrid() {
            grid.innerHTML = '';
            
            let displayList = courses.filter(c => {
                const strandMatch = filterStrand === 'All' || c.strand === filterStrand;
                
                // UPDATED TIME FILTER LOGIC
                // If filter is 'All', show everything.
                // Otherwise, perform an exact match on the duration string from the data.
                // Assuming data uses "Half Day AM", "Half Day PM", "Full Day"
                const timeMatch = filterTime === 'All' || c.duration === filterTime;
                
                const searchTarget = `${c.title} ${c.tagline} ${c.teachers}`.toLowerCase();
                const searchMatch = searchQuery === '' || searchTarget.includes(searchQuery.toLowerCase());
                return strandMatch && timeMatch && searchMatch;
            });

            if (currentSort === 'number') {
                displayList.sort((a, b) => String(a.courseNumber).localeCompare(String(b.courseNumber), undefined, {numeric: true}));
            } else if (currentSort === 'name') {
                displayList.sort((a, b) => a.title.localeCompare(b.title));
            } else if (currentSort === 'random') {
                // Note: In a real app, you might want to shuffle only once or seed the shuffle 
                // so it doesn't change on every keystroke, but for this demo random sort is re-run on render.
                // If the user selects "Random" explicitly, we re-shuffle.
                // If the user types in search, we might want to preserve order, but simple shuffle is ok here.
                 if (currentSort === 'random' && searchQuery === '') {
                     // Only truly random shuffle if we are not actively filtering/searching to keep UI stable? 
                     // Or just shuffle every time. Let's keep it simple.
                     displayList.sort(() => Math.random() - 0.5);
                 }
            }

            displayList.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card group bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-xl cursor-pointer flex flex-col';
                
                // Logic for the label on the card image
                let timeLabel = '';
                if (course.duration === 'Half Day AM') timeLabel = 'AM';
                else if (course.duration === 'Half Day PM') timeLabel = 'PM';
                else timeLabel = 'Full Day';

                card.innerHTML = `
                    <div class="relative h-56 overflow-hidden bg-slate-200">
                        <img src="${course.photo}" alt="" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                        <div class="absolute top-3 left-3 bg-white/95 backdrop-blur shadow-sm text-slate-900 text-xs font-black px-3 py-1.5 rounded-lg uppercase border border-slate-100">${timeLabel}</div>
                        ${course.isPopular ? `<div class="absolute top-3 right-3 bg-orange-600 text-white px-3 py-1 rounded-lg shadow-lg text-[10px] font-black uppercase tracking-widest border border-orange-400">Popular</div>` : ''}
                    </div>
                    <div class="p-6 flex-grow">
                        <span class="text-[10px] font-black uppercase tracking-widest text-indigo-600">${course.strand}</span>
                        <h3 class="text-xl font-extrabold text-slate-900 leading-tight mt-1 line-clamp-2">${course.title}</h3>
                        
                    </div>
                `;
                card.onclick = () => openModal(course);
                grid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; renderGrid(); });
        sortSelect.addEventListener('change', (e) => { currentSort = e.target.value; renderGrid(); });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = (e) => {
                const type = e.target.dataset.type;
                const val = e.target.dataset.val;
                
                if (type === 'strand') {
                    // Toggle logic for Strand
                    if (filterStrand === val && val !== 'All') {
                         filterStrand = 'All'; // Toggle off
                    } else {
                         filterStrand = val;
                    }
                }
                
                if (type === 'duration') {
                    // Toggle logic for Duration
                    if (filterTime === val) {
                        filterTime = 'All'; // Toggle off if clicking the same active filter
                    } else {
                        filterTime = val;
                    }
                }

                // Update UI classes
                // 1. Reset all buttons of this type
                e.target.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
                
                // 2. Set 'All' active if filter is 'All', otherwise set specific button active
                if (type === 'strand') {
                     if (filterStrand === 'All') {
                         document.querySelector('button[data-type="strand"][data-val="All"]').classList.add('active-filter');
                     } else {
                         document.querySelector(`button[data-type="strand"][data-val="${filterStrand}"]`).classList.add('active-filter');
                     }
                }
                
                if (type === 'duration') {
                    if (filterTime !== 'All') {
                        document.querySelector(`button[data-type="duration"][data-val="${filterTime}"]`).classList.add('active-filter');
                    }
                    // We don't have an "All" button visible for Time, so no else needed for highlighting "All"
                }
                
                renderGrid();
            };
        });

        document.getElementById('reset-btn').onclick = () => {
            filterStrand = 'All'; filterTime = 'All'; currentSort = 'random'; searchQuery = '';
            sortSelect.value = 'random'; searchInput.value = '';
            
            // Clear all active states
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
            // Set Strand All to active
            document.querySelector('button[data-type="strand"][data-val="All"]').classList.add('active-filter');
            
            renderGrid();
        };

        function openModal(c) {
            document.getElementById('m-title').innerText = c.title;
            document.getElementById('m-description').innerText = c.description;
            document.getElementById('m-strand').innerText = c.strand;
            document.getElementById('m-duration').innerText = c.duration;
            document.getElementById('m-teachers').innerText = c.teachers ? `Instructors: ${c.teachers}` : '';
            document.getElementById('m-photo').src = c.photo;
            const pBox = document.getElementById('m-prereq-box');
            if (c.prereq && c.prereq.trim() !== "") {
                pBox.classList.remove('hidden');
                document.getElementById('m-prereq').innerText = c.prereq;
            } else { pBox.classList.add('hidden'); }
            overlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('close-btn').onclick = () => { overlay.classList.add('hidden'); document.body.style.overflow = ''; };
        overlay.onclick = (e) => { if(e.target === overlay) { overlay.classList.add('hidden'); document.body.style.overflow = ''; }};
        
        // Initial Render
        renderGrid();
    </script>
</body>
